version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:ganesh@host.docker.internal:5432/taskmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  frontend:
    build:
       context: ./frontend
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend
